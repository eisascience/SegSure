[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "segsure"
version = "0.1.0"
description = "Spatially resolved detection and refinement of cell-segmentation uncertainty in image-based transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "EISA Science", email = "info@eisascience.com"}
]
keywords = ["transcriptomics", "segmentation", "spatial", "uncertainty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-image>=0.18",
    "anndata>=0.8",
    "scanpy>=1.9",
    "zarr>=2.10",
    "h5py>=3.0",
    "pyyaml>=5.4",
    "shapely>=1.7",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
]
dev = [
    "black>=21.0",
    "flake8>=3.9",
    "isort>=5.9",
    "mypy>=0.900",
]
notebook = [
    "jupyter>=1.0",
    "jupyterlab>=3.0",
    "ipywidgets>=7.6",
]

[project.urls]
Homepage = "https://github.com/eisascience/SegSure"
Documentation = "https://github.com/eisascience/SegSure"
Repository = "https://github.com/eisascience/SegSure.git"
"Bug Tracker" = "https://github.com/eisascience/SegSure/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["segsure*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
